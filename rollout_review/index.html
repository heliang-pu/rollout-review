<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回放审核</title>
<style>
  :root { --bg:#f6f6f4; --panel:#fff; --line:#d9d9d4; --text:#1c1c1a; --dim:#6b6b66; --ok:#2c8a4a; --bad:#c8443a; --unsure:#b57a12; --pick:#e6eefb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1e; --line:#3a3a37; --text:#ecece8; --dim:#9a9a94; --pick:#263347; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, "Noto Sans CJK SC", sans-serif; }
  header { padding:10px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  header h1 { font-size:16px; margin:0 8px 0 0; }
  select, input, button, textarea { font:inherit; color:inherit; background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  button { cursor:pointer; }
  main { display:grid; grid-template-columns:minmax(260px, 340px) 1fr; gap:12px; padding:12px 16px; }
  @media (max-width: 800px) { main { grid-template-columns:1fr; } #list { max-height:34vh; } }
  #list { background:var(--panel); border:1px solid var(--line); border-radius:8px; overflow:auto; max-height:calc(100vh - 110px); }
  .row { display:grid; grid-template-columns:64px 1fr auto; gap:8px; padding:6px 10px; border-bottom:1px solid var(--line); cursor:pointer; align-items:center; }
  .row.pick { background:var(--pick); }
  .row .task { color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:12px; }
  .mark { font-size:12px; padding:1px 7px; border-radius:10px; color:#fff; white-space:nowrap; }
  .ok { background:var(--ok); } .problem { background:var(--bad); } .unsure { background:var(--unsure); }
  .none { background:transparent; color:var(--dim); border:1px solid var(--line); } .stale { background:transparent; color:var(--unsure); border:1px dashed var(--unsure); }
  #view { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-width:0; }
  video { width:100%; max-height:62vh; background:#000; border-radius:6px; }
  #title { font-weight:600; margin-bottom:8px; overflow-wrap:anywhere; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:10px; }
  .bar button.v { color:#fff; border:none; padding:7px 16px; }
  .bar button.on { outline:3px solid var(--text); outline-offset:1px; }
  #note { flex:1 1 240px; } #tags { flex:0 1 200px; }
  #msg { color:var(--bad); min-height:1.4em; margin-top:6px; }
  .hint { color:var(--dim); font-size:12px; margin-top:8px; }
  #counts { color:var(--dim); }
</style>
</head>
<body>
<header>
  <h1>回放审核</h1>
  <label>数据集 <select id="fDataset"><option value="">全部</option></select></label>
  <label>任务 <select id="fTask"><option value="">全部</option></select></label>
  <label>结论 <select id="fVerdict">
    <option value="">全部</option><option value="none">还没看</option><option value="ok">没问题</option>
    <option value="problem">有问题</option><option value="unsure">不确定</option><option value="stale">结论已失效</option>
  </select></label>
  <span id="counts"></span>
  <a href="/api/export.csv"><button>导出 CSV</button></a>
</header>
<main>
  <div id="list"></div>
  <div id="view">
    <div id="title">在左边选一集</div>
    <video id="video" controls muted playsinline></video>
    <div class="bar">
      <button class="v ok" data-v="ok">没问题 (1)</button>
      <button class="v problem" data-v="problem">有问题 (2)</button>
      <button class="v unsure" data-v="unsure">不确定 (3)</button>
      <button id="clear">清除结论 (0)</button>
      <label><input type="checkbox" id="auto" checked> 判完自动跳到下一集</label>
    </div>
    <div class="bar">
      <input id="tags" placeholder="标签，空格分隔">
      <input id="note" placeholder="备注">
      <button id="saveText">保存标签和备注</button>
    </div>
    <div id="msg"></div>
    <div class="hint">键盘：1 没问题，2 有问题，3 不确定，0 清除；J 下一集，K 上一集；空格 播放或暂停；← → 快退快进 1 秒。
      "结论已失效"表示这个编号下的数据在判完之后变了（重新编号或重录），需要重看。</div>
  </div>
</main>
<script>
const NAMES = { ok: "没问题", problem: "有问题", unsure: "不确定" };
let all = [], shown = [], current = null;
const $ = (id) => document.getElementById(id);
const key = (r) => r.dataset + "#" + r.episode;

async function load() {
  const data = await (await fetch("/api/episodes")).json();
  all = data.episodes;
  fill($("fDataset"), data.datasets.map((d) => d.name));
  fill($("fTask"), [...new Set(all.map((r) => r.task))].filter(Boolean));
  const c = data.count;
  $("counts").textContent = `共 ${c.all} 集：没问题 ${c.ok}，有问题 ${c.problem}，不确定 ${c.unsure}，还没看 ${c.none}`;
  render();
}
function fill(select, values) {
  const keep = select.value;
  while (select.options.length > 1) select.remove(1);
  for (const v of values) select.add(new Option(v.length > 40 ? v.slice(0, 40) + "…" : v, v));
  select.value = keep;
}
function render() {
  const d = $("fDataset").value, t = $("fTask").value, v = $("fVerdict").value;
  shown = all.filter((r) => (!d || r.dataset === d) && (!t || r.task === t) &&
    (!v || (v === "none" ? !r.verdict && !r.stale : v === "stale" ? !!r.stale : r.verdict === v)));
  const list = $("list");
  list.textContent = "";
  for (const r of shown) {
    const row = document.createElement("div");
    row.className = "row" + (current && key(current) === key(r) ? " pick" : "");
    const mark = r.stale ? ["stale", "已失效"] : r.verdict ? [r.verdict, NAMES[r.verdict]] : ["none", "还没看"];
    const cells = [["", `第 ${r.episode} 集`], ["task", `${r.dataset} · ${r.seconds} 秒 · ${r.task}`], ["mark " + mark[0], mark[1]]];
    for (const [cls, text] of cells) { const s = document.createElement("span"); s.className = cls; s.textContent = text; row.append(s); }
    row.onclick = () => pick(r);
    list.append(row);
  }
  if (!shown.length) list.textContent = "没有符合条件的集";
}
function pick(r) {
  current = r;
  $("title").textContent = `${r.dataset} 第 ${r.episode} 集（${r.length} 帧，${r.seconds} 秒）${r.task}`;
  $("video").src = `/video?dataset=${encodeURIComponent(r.dataset)}&episode=${r.episode}`;
  $("video").play().catch(() => {});
  $("tags").value = r.tags.join(" ");
  $("note").value = r.note;
  $("msg").textContent = "";
  for (const b of document.querySelectorAll("button.v")) b.classList.toggle("on", b.dataset.v === r.verdict);
  render();
  const row = document.querySelector(".row.pick");
  if (row) row.scrollIntoView({ block: "nearest" });
}
async function judge(verdict, move) {
  if (!current) return;
  const body = { dataset: current.dataset, episode: current.episode, verdict,
    tags: $("tags").value.split(/\s+/).filter(Boolean), note: $("note").value };
  const res = await fetch("/api/judge", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) { $("msg").textContent = "没有保存：" + data.error; return; }
  const at = shown.findIndex((r) => key(r) === key(current));
  const next = move && $("auto").checked ? shown[at + 1] : null;
  const mine = key(current);
  await load();
  const again = all.find((r) => key(r) === mine);
  if (next) pick(all.find((r) => key(r) === key(next)) || next); else if (again) { current = again; pick(again); }
}
function step(by) {
  const at = current ? shown.findIndex((r) => key(r) === key(current)) : -1;
  const next = shown[Math.max(0, Math.min(shown.length - 1, at + by))];
  if (next) pick(next);
}
for (const b of document.querySelectorAll("button.v")) b.onclick = () => judge(b.dataset.v, true);
$("clear").onclick = () => judge(null, false);
$("saveText").onclick = () => current && current.verdict ? judge(current.verdict, false) : ($("msg").textContent = "先给出结论，标签和备注随结论一起保存");
for (const id of ["fDataset", "fTask", "fVerdict"]) $(id).onchange = render;
$("video").onerror = async () => {
  if (!current || !$("video").src) return;
  try { const r = await fetch($("video").src); if (!r.ok) $("msg").textContent = "视频打不开：" + (await r.json()).error; } catch (e) {}
};
document.addEventListener("keydown", (e) => {
  if (["INPUT", "TEXTAREA", "SELECT"].includes(e.target.tagName)) return;
  const v = $("video");
  if (e.key === "1") judge("ok", true); else if (e.key === "2") judge("problem", true); else if (e.key === "3") judge("unsure", true);
  else if (e.key === "0") judge(null, false);
  else if (e.key === "j" || e.key === "J") step(1); else if (e.key === "k" || e.key === "K") step(-1);
  else if (e.key === " ") { e.preventDefault(); v.paused ? v.play() : v.pause(); }
  else if (e.key === "ArrowRight") v.currentTime += 1; else if (e.key === "ArrowLeft") v.currentTime -= 1;
});
load();
</script>
</body>
</html>
